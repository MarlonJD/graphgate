schema: ../../../../emsi_go_api/internal/graph/schema.graphqls
operations:
  - ./operations/**/*.graphql
manifest:
  format: graphgate
  output: ./graphgate.manifest.json
environments:
  local:
    endpoint: http://localhost:8080/graphql
    headers:
      Authorization: Bearer ${GRAPHGATE_TOKEN}
tests:
  fixtures: ./fixtures/**/*.json
reports:
  output: ./reports
