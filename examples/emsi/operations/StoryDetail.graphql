query EMSIStoryDetail($id: ID!) {
  storyDetail(id: $id) {
    id
    authorUserID
    authorUsername
    storyType
    caption
    mediaURL
    mediaType
    targetType
    targetID
    targetKey
    state
    seen
    viewerReaction {
      storyID
      emojiID
      key
      unified
      url
      createdAt
      updatedAt
    }
    replyCount
    canHide
    canReport
    shareURL
    createdAt
    expiresAt
    updatedAt
  }
}
