query EMSIUserEvents($userID: ID) {
  userEvents(userID: $userID) {
    id
    title
    summary
    channelID
    channelName
    city
    venue
    date
    capacity
    joinedCount
    waitingCount
    isCancelled
    isFull
    participation
    tags
    host {
      id
      fullName
      city
      avatarURL
    }
  }
}
