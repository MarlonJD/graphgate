query EMSIRecommendedActivity($limit: Int = 5) {
  recommendedActivity(limit: $limit) {
    id
    title
    summary
    channelID
    channelName
    city
    venue
    date
    capacity
    joinedCount
    waitingCount
    isCancelled
    isFull
    participation
    tags
    host {
      id
      fullName
      city
      avatarURL
    }
  }
}
