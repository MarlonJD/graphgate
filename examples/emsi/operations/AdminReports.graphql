query EMSIAdminReports($state: String, $limit: Int = 100) {
  adminReports(state: $state, limit: $limit) {
    limit
    items {
      id
      category
      state
      riskLevel
      targetType
      targetID
      targetTitle
      targetPreviewSummary
      createdAt
      relatedReportCount
      reporter {
        field
        state
        canReveal
        reasonRequired
        auditAction
      }
    }
  }
}
