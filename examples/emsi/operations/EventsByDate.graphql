query EMSIEventsByDate($date: String!, $cityID: ID) {
  eventsByDate(date: $date, cityID: $cityID) {
    id
    title
    summary
    channelID
    channelName
    city
    venue
    date
    capacity
    joinedCount
    waitingCount
    isCancelled
    isFull
    participation
    tags
    host {
      id
      fullName
      city
      avatarURL
    }
  }
}
