query EMSIReplyHistory($postID: ID!) {
  replyHistory(postID: $postID) {
    id
    legacyPostID
    channelID
    parentPostID
    author {
      id
      legacyUserID
      username
      usernameColor
      pictureURL
    }
    content
    attachmentURL
    thumbnailURL
    blurhash
    width
    height
    replyCount
    reactionSummary {
      emojiID
      key
      unified
      url
      count
      updatedAt
    }
    createdAt
    updatedAt
  }
}
